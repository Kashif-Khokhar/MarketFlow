version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: marketflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - marketflow-network

  redis:
    image: redis:alpine
    container_name: marketflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marketflow-network

volumes:
  mongodb_data:
  redis_data:

networks:
  marketflow-network:
    driver: bridge
